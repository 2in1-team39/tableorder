<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}항아리 손칼국수 주문 관리 시스템{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        html { -webkit-text-size-adjust: 100%; }
        body {
            padding-top: calc(58px + env(safe-area-inset-top));
            -webkit-tap-highlight-color: transparent;
        }
        .table-card {
            border: 2px solid #ddd;
            border-radius: 10px;
            padding: 20px;
            margin: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            min-height: 120px;
        }
        .table-empty { background-color: #f8f9fa; border-color: #6c757d; }
        .table-ordered { background-color: #fff3cd; border-color: #ffc107; }
        .table-cooking { background-color: #f8d7da; border-color: #dc3545; }
        .table-paid { background-color: #d1edff; border-color: #0dcaf0; }
        .table-card:hover { transform: scale(1.05); box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
        .navbar-brand { font-weight: bold; }
        .app-navbar .container {
            flex-wrap: nowrap;
            gap: 0.75rem;
            min-height: 58px;
        }
        .app-navbar .navbar-brand {
            flex: 0 1 auto;
            margin-right: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .app-navbar .navbar-nav {
            flex: 1 1 auto;
            flex-direction: row;
            flex-wrap: nowrap;
            justify-content: flex-end;
            overflow-x: auto;
            scrollbar-width: none;
        }
        .app-navbar .navbar-nav::-webkit-scrollbar { display: none; }
        .app-navbar .nav-link {
            flex: 0 0 auto;
            min-height: 44px;
            display: flex;
            align-items: center;
            padding: 0.5rem 0.7rem;
            white-space: nowrap;
        }
        .page-container {
            margin-top: 0 !important;
            padding-top: 1.25rem;
            padding-bottom: max(1.5rem, env(safe-area-inset-bottom));
        }
        button, .btn, select, input, textarea { touch-action: manipulation; }
        .modal-dialog { margin: 0.75rem auto; }
        .modal-body { -webkit-overflow-scrolling: touch; }
        .status-badge:hover { 
            opacity: 0.8; 
            transform: scale(1.1);
            transition: all 0.2s;
        }
        .status-badge {
            transition: all 0.2s;
            position: relative;
        }
        .status-badge::after {
            content: ' 🔄';
            font-size: 0.8em;
            opacity: 0;
            transition: opacity 0.2s;
        }
        .status-badge:hover::after {
            opacity: 1;
        }
        @media (max-width: 991.98px) {
            .app-navbar .container { max-width: none; }
            .app-navbar .navbar-brand { font-size: 1rem; }
            .app-navbar .nav-link { font-size: 0.9rem; padding: 0.45rem 0.5rem; }
            .page-container { padding-left: 1rem; padding-right: 1rem; }
        }
        @media (max-width: 575.98px) {
            .app-navbar .container { gap: 0.35rem; padding-left: 0.75rem; padding-right: 0.75rem; }
            .app-navbar .brand-name { display: none; }
            .app-navbar .navbar-brand { flex: 0 0 auto; padding: 0.5rem 0.25rem; }
            .app-navbar .nav-link { font-size: 0.82rem; padding: 0.5rem 0.42rem; }
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-dark bg-primary app-navbar fixed-top">
        <div class="container">
            <a class="navbar-brand" href="{% url 'tables:dashboard' %}">
                <i class="fas fa-utensils"></i><span class="brand-name"> 항아리 손칼국수</span>
            </a>
            <div class="navbar-nav">
                <a class="nav-link" href="{% url 'tables:dashboard' %}">테이블 현황</a>
                <a class="nav-link" href="{% url 'orders:list' %}">주문 관리</a>
                <a class="nav-link" href="{% url 'menus:list' %}">메뉴 관리</a>
                <a class="nav-link" href="{% url 'reports:dashboard' %}">매출 관리</a>
                <a class="nav-link" href="/admin/">관리자</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4 page-container">
        {% block content %}
        {% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}
    {% endblock %}
</body>
</html>
